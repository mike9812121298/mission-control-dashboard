name: Independent commerce monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: independent-commerce-monitor
  cancel-in-progress: false
jobs:
  public-purchase-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOCAL_CHECK_LAST_SUCCESS: ${{ vars.LOCAL_CHECK_LAST_SUCCESS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test heartbeat expiry
        run: python3 -m unittest discover -s monitor -p "test_*.py"
      - name: Check both public stores and four unpaid GT40 checkout paths
        run: python3 monitor/check.py
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'
      - name: Install browser test dependencies
        if: always()
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Test seven mobile and desktop purchase journeys
        if: always()
        run: npm run check:browser
